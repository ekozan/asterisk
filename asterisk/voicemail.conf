;==============================================================================
; voicemail.conf — PARTIE STATIQUE.
; La liste des boîtes est générée : generated/voicemail_generated.conf.
;==============================================================================

[general]
format=wav49|gsm|wav
serveremail=asterisk@localhost
attach=yes
maxmsg=50
maxsecs=180
minsecs=2
maxsilence=5
silencethreshold=128
maxlogins=3
skipms=3000
review=yes
envelope=yes
nextaftercmd=yes
; N'annonce pas « appuyez sur 1 pour le répertoire » : inutile ici.
pbxskip=yes
operator=no
emaildateformat=%A %d %B %Y à %H:%M
emailsubject=Message vocal de ${VM_CALLERID} sur la boîte ${VM_MAILBOX}
emailbody=Bonjour ${VM_NAME},\n\nvous avez un nouveau message de ${VM_CALLERID}\ndurée ${VM_DUR}, reçu le ${VM_DATE}.\n\nIl est joint à ce courriel.\n

[zonemessages]
fr=Europe/Paris|'vm-received' q 'digits/at' R

;------------------------------------------------------------------------------
; Le #include prolonge la section [default] ouverte juste au-dessus : les
; lignes « boite => PIN,Nom,... » du fichier généré appartiennent donc bien au
; contexte de messagerie `default`.
;------------------------------------------------------------------------------
[default]
#include generated/voicemail_generated.conf
