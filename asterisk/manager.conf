;==============================================================================
; manager.conf — AMI en écoute UNIQUEMENT sur la boucle locale.
;
; L'UI de gestion, elle, ne passe pas par là : elle pilote Asterisk par
; `asterisk -rx` (socket de contrôle local, accessible parce que le service
; tourne sous l'utilisateur `asterisk`). Elle n'a besoin ni de port TCP ni de
; mot de passe AMI.
;
; L'AMI sert au seul service `telephonie-events`, qui traduit les événements
; d'Asterisk vers MQTT pour Home Assistant. Il lui faut un flux d'événements en
; temps réel : `asterisk -rx` interrogé en boucle ne le donnerait pas, et
; coûterait un processus par sondage.
;
; Trois barrières, parce qu'un AMI ouvert est un pilotage complet du PBX :
;   - `bindaddr = 127.0.0.1` : aucun paquet venu du réseau n'arrive jusqu'ici ;
;   - `deny` puis `permit` : même si bindaddr changeait, seule la machine elle-
;     même serait acceptée ;
;   - un compte par outil, en LECTURE SEULE (aucun `write`), donc incapable
;     d'originer un appel ou de recharger quoi que ce soit.
;==============================================================================

[general]
enabled = yes
webenabled = no
bindaddr = 127.0.0.1
port = 5038
; Un échec d'identification AMI est journalisé en NOTICE, donc visible de
; fail2ban comme les échecs SIP.
authtimeout = 30
authlimit = 10

;------------------------------------------------------------------------------
; Comptes. Le fichier inclus est écrit par scripts/install.sh avec un mot de
; passe tiré au hasard, et n'est pas dans le dépôt : un secret versionné serait
; le même sur toutes les installations.
;
; Il ne contient qu'un compte, en lecture seule, limité aux familles
; d'événements dont le pont a besoin :
;
;   [telephonie-events]
;   secret = <tiré au hasard à l'installation>
;   deny = 0.0.0.0/0
;   permit = 127.0.0.1/32
;   read = system,call,dialplan,cdr
;   write =
;
; La classe `cdr` est indispensable : sans elle, `cdr_manager` émet bien ses
; enregistrements, mais l'AMI ne les délivre pas — et rien ne le signale.
;------------------------------------------------------------------------------
#include manager.d/*.conf
