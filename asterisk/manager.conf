;==============================================================================
; manager.conf — AMI VOLONTAIREMENT DÉSACTIVÉ.
;
; L'UI de gestion pilote Asterisk par `asterisk -rx` (socket de contrôle local,
; accessible parce que le service tourne sous l'utilisateur `asterisk`). Elle
; n'a donc besoin d'aucun port TCP en écoute ni d'aucun mot de passe AMI.
;
; Si vous activez l'AMI plus tard pour un outil tiers, gardez au minimum :
;   enabled = yes / bindaddr = 127.0.0.1 / deny=0.0.0.0/0 + permit=127.0.0.1/32
; et un compte par outil, avec les droits `read`/`write` strictement nécessaires.
;==============================================================================

[general]
enabled = no
webenabled = no
