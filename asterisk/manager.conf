;==============================================================================
; manager.conf — AMI, utilisé par l'intégration Home Assistant (HACS).
;
; L'UI de gestion ne s'en sert pas : elle pilote Asterisk par `asterisk -rx`, en
; passant par le socket de contrôle local, accessible parce que le service
; tourne sous l'utilisateur `asterisk`. Ni mot de passe ni ACL pour ça.
;
; L'AMI n'existe ici que pour l'intégration `TECH7Fox/asterisk-hass-integration`,
; qui tourne DANS Home Assistant et se connecte donc depuis le réseau. C'est ce
; qui la distingue d'un pont local : le port doit être joignable, et le compte
; doit pouvoir exécuter des actions.
;
; Trois barrières, parce qu'un AMI ouvert est un pilotage complet du PBX :
;   - le compte n'est écrit que si `install.sh --ha-ip <adresse>` a été passé.
;     Sans cette adresse, `manager.d/` reste vide et personne ne peut se
;     connecter, quel que soit le `bindaddr` ci-dessous ;
;   - `deny` puis `permit` sur la seule adresse de Home Assistant ;
;   - des classes taillées au besoin réel, et surtout pas `write = all`.
;
; `bindaddr` est volontairement laissé sur 0.0.0.0 : l'adresse du vNIC
; d'administration dépend de votre installation. Si vous la connaissez, la
; renseigner ici est une barrière de plus — l'écran « Fichiers » de l'interface
; permet de le faire sans SSH.
;==============================================================================

[general]
enabled = yes
webenabled = no
bindaddr = 0.0.0.0
port = 5038
; Un échec d'identification est journalisé en NOTICE, donc visible de fail2ban
; comme les échecs SIP.
authtimeout = 30
authlimit = 10
; Empêche un client d'ouvrir un flux d'événements qu'il n'a pas demandé.
displayconnects = no

;------------------------------------------------------------------------------
; Comptes. Le fichier inclus est écrit par scripts/install.sh --ha-ip, avec un
; mot de passe tiré au hasard : un secret versionné serait le même sur toutes
; les installations.
;
;   [homeassistant]
;   secret = <tiré au hasard à l'installation>
;   deny = 0.0.0.0/0
;   permit = <adresse de Home Assistant>/32
;   read = system,call,dtmf,reporting
;   write = system,reporting
;
; `read` gouverne les ÉVÉNEMENTS reçus, `write` les ACTIONS autorisées — deux
; choses distinctes qu'on confond souvent. L'intégration a besoin des deux :
; elle écoute DeviceStateChange, Newchannel, Hangup, NewConnectedLine (classe
; `call`) et DTMFBegin (classe `dtmf`), mais elle exécute aussi `SIPpeers` et
; `PJSIPShowEndpoints` au démarrage pour découvrir les postes — d'où `write`.
;
; Pour connaître la classe exigée par une action précise :
;   asterisk -rx "manager show command PJSIPShowEndpoints"
;
; `write` ne contient PAS `originate` ni `call` : en l'état, le service
; `asterisk.send_action` de l'intégration peut interroger, pas lancer d'appel.
; Ajoutez `originate` seulement si vous voulez ce pouvoir depuis Home Assistant,
; en sachant que c'est de la fraude téléphonique en puissance si HA est
; compromis. L'interface expose déjà /api/call pour ça, avec validation du
; numéro et jeton dédié.
;------------------------------------------------------------------------------
#include manager.d/*.conf
