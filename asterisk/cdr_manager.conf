;==============================================================================
; cdr_manager.conf — publication des CDR comme événements AMI.
;
; Asterisk n'a pas de backend CDR vers MQTT, et n'en aura pas : la façon prévue
; de sortir les enregistrements en temps réel est de les émettre sur l'AMI et de
; laisser un pont externe les traduire. C'est ce que fait `telephonie-events`.
;
; Ce module ne remplace pas cdr_csv : les deux tournent en parallèle. Le CSV
; reste la trace durable et complète, lisible même quand tout le reste est
; arrêté ; l'AMI en est une copie volatile, pour prévenir Home Assistant.
;
; Le compte AMI doit inclure la classe `cdr` dans son `read`, sinon les
; événements sont émis mais jamais délivrés — sans le moindre message d'erreur.
;==============================================================================

[general]
enabled = yes
