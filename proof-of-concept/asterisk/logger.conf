;==============================================================================
; logger.conf
;
; `messages` est le fichier lu par fail2ban : il doit contenir les NOTICE, qui
; sont le niveau auquel Asterisk journalise les échecs d'authentification SIP.
; `full` reste utile au diagnostic mais grossit vite — logrotate s'en occupe
; (installé par `make install-logrotate`).
;==============================================================================

[general]
dateformat=%F %T
; Ajoute l'identifiant d'appel à chaque ligne : indispensable pour suivre un
; appel précis dans un fichier qui en mélange plusieurs.
use_callids=yes

[logfiles]
console => notice,warning,error
messages => notice,warning,error
full => notice,warning,error,verbose,dtmf
security => security
