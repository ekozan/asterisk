;==============================================================================
; cdr.conf — journal des appels.
; Le CSV produit ici alimente l'écran « Journal » de l'UI (lecture seule).
; Fichier : /var/log/asterisk/cdr-csv/Master.csv
;==============================================================================

[general]
enable=yes
; Journalise aussi les appels non décrochés : c'est justement ceux-là qu'on
; cherche quand on se demande « est-ce que ça a sonné ? ».
unanswered=yes
congestion=yes

[csv]
usegmtime=no
loguniqueid=yes
loguserfield=yes
