;==============================================================================
; rtp.conf
;
; Plage RTP volontairement étroite : une maison ne passe jamais 50 appels
; simultanés, et une plage de 200 ports est bien plus facile à autoriser
; précisément dans le pare-feu qu'un intervalle 10000-20000 par défaut.
; Compter 2 ports par appel actif.
;==============================================================================

[general]
rtpstart=10000
rtpend=10200
; Ignore les paquets RTP qui ne viennent pas de la source négociée : bloque
; l'injection audio par un tiers qui devinerait le port.
strictrtp=yes
; Pas de WebRTC dans cette installation.
icesupport=no
