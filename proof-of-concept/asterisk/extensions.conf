;==============================================================================
; extensions.conf — PARTIE STATIQUE, éditée à la main.
;
; Les contextes qui dépendent de vos postes, personnes et routes sont générés
; dans generated/extensions_generated.conf (inclus ci-dessous) :
;   [from-internal] [from-external-incoming] [menu-personne]
;   [sub-dial-number] [notify] [globals]
;
; Ici ne restent que les briques stables : sous-routines et codes de service.
;==============================================================================

[general]
static=yes
; Empêche `dialplan save` depuis la CLI d'écraser ce fichier écrit à la main.
writeprotect=yes
clearglobalvars=no

;------------------------------------------------------------------------------
; Contextes générés par l'UI (contient aussi [globals]).
;------------------------------------------------------------------------------
#include generated/extensions_generated.conf

;==============================================================================
; Contexte par défaut : volontairement vide.
; Un canal qui atterrit ici (mauvaise configuration d'un endpoint) ne peut rien
; composer, plutôt que d'hériter par accident d'un droit d'appel sortant.
;==============================================================================
[default]

;==============================================================================
; SOUS-ROUTINE : faire sonner une ou plusieurs destinations, puis messagerie
;
; ARG1 = chaîne Dial (ex: PJSIP/salon ou PJSIP/salon&PJSIP/mobile)
; ARG2 = durée de sonnerie en secondes
; ARG3 = boîte vocale de repli (peut être vide : dans ce cas, pas de messagerie)
;==============================================================================
[sub-ring]
exten => s,1,NoOp(Sonnerie de ${ARG1} pendant ${ARG2}s)
 same => n,Set(CHANNEL(tonezone)=${TONEZONE})
 same => n,Set(CHANNEL(language)=${LANGUE})
 same => n,Dial(${ARG1},${ARG2})
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?fin)
 same => n,GotoIf($["${ARG3}" = ""]?fin)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?occupe)
 same => n,Voicemail(${ARG3}@default,u)
 same => n,Goto(fin)
 same => n(occupe),Voicemail(${ARG3}@default,b)
 same => n(fin),Return()

;==============================================================================
; CODES DE SERVICE — inclus dans [from-internal] par le fichier généré
;==============================================================================
[features]

; Consulter SA messagerie (la boîte porte le numéro du poste appelant).
exten => *97,1,NoOp(Messagerie du poste ${CALLERID(num)})
 same => n,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()

; Consulter UNE AUTRE boîte : demande le numéro de boîte puis le code.
exten => *98,1,VoiceMailMain(@default)
 same => n,Hangup()

; Test d'écho : vérifie la qualité audio d'un poste dans les deux sens.
exten => *43,1,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; Annonce de l'heure.
exten => *60,1,Answer()
 same => n,Wait(1)
 same => n,SayUnixTime(,Europe/Paris,'digits/at' IMp)
 same => n,Hangup()

; Annonce du numéro du poste : pratique pour identifier un ATA après câblage.
exten => *65,1,Answer()
 same => n,Wait(1)
 same => n,SayDigits(${CALLERID(num)})
 same => n,Hangup()
