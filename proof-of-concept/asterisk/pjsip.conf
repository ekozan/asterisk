;==============================================================================
; pjsip.conf — PARTIE STATIQUE, éditée à la main.
;
; Les endpoints (postes, ponts FXO) ne sont PAS ici : ils sont générés depuis la
; base par l'UI de gestion, dans generated/pjsip_endpoints.conf, inclus en fin
; de fichier. Ce découpage permet de régénérer les postes sans jamais risquer
; d'écraser les réglages de transport ou de sécurité.
;
; Les gabarits ci-dessous (`(!)`) doivent rester DÉFINIS AVANT le #include :
; un gabarit n'est utilisable qu'après sa déclaration.
;==============================================================================

[global]
type=global
user_agent=PBX
; PJSIP n'a pas d'équivalent aux options `allowguest` / `alwaysauthreject` de
; l'ancien chan_sip : un appel non authentifié est rejeté d'office tant qu'aucun
; endpoint nommé « anonymous » n'existe. N'en créez jamais.
endpoint_identifier_order=ip,username,anonymous
; Ne pas révéler la version d'Asterisk aux scanners.
default_from_user=pbx

[system]
type=system
timer_t1=500
timer_b=32000
; Coupe la reprise automatique d'un enregistrement en échec permanent.
disable_tcp_switch=yes

;------------------------------------------------------------------------------
; Transport. En VLAN dédié VOIP, remplacez 0.0.0.0 par l'IP du vNIC VLAN 90 :
; Asterisk n'écoute alors plus du tout sur les autres interfaces.
;------------------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=10.0.90.0/24
local_net=127.0.0.0/8

;------------------------------------------------------------------------------
; Gabarits appliqués aux endpoints générés.
;------------------------------------------------------------------------------

; Postes de la maison : ATA FXS, base DECT, softphone mobile.
[endpoint-internal](!)
type=endpoint
context=from-internal
disallow=all
allow=alaw
allow=ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
language=fr
tos_audio=ef
cos_audio=5
allow_transfer=yes
trust_id_inbound=no
allow_subscribe=yes

; Trunks : pont FXO vers la Freebox, passerelles externes. Le transfert d'appel
; y est interdit — c'est le vecteur classique de fraude à la tonalité, où un
; appel entrant est renvoyé vers un numéro surtaxé à l'étranger.
[endpoint-trunk](!)
type=endpoint
context=from-external-incoming
disallow=all
allow=alaw
allow=ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
language=fr
allow_transfer=no
trust_id_inbound=no

;------------------------------------------------------------------------------
; Endpoints générés par l'UI. Ne pas déplacer cette ligne avant les gabarits.
;------------------------------------------------------------------------------
#include generated/pjsip_endpoints.conf
